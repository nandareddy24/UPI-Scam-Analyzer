<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ScamShield Android App</title>
    <link rel="manifest" href="/static/manifest.webmanifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .mobile-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .bottom-dock {
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid #334155;
        }
        .dock-item {
            transition: all 0.2s ease;
        }
        .dock-item.active {
            color: #10b981;
            font-weight: 700;
        }
        .scan-tab-mobile {
            transition: all 0.2s ease;
        }
        .scan-tab-mobile.selected {
            background-color: #065f46;
            border-color: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        #cameraVideo {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 16px;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <!-- Top Android App Bar -->
    <header class="bg-[#0f172a] px-5 py-4 border-b border-slate-800 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 flex items-center justify-center font-extrabold text-lg">
                🛡️
            </div>
            <div>
                <h1 class="text-lg font-extrabold tracking-tight text-white">ScamShield</h1>
                <p class="text-[10px] text-emerald-400 font-semibold flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>Android Protection Active</span>
                </p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <a href="tel:1930" class="px-3 py-1.5 bg-red-600/30 border border-red-500/50 text-red-400 rounded-full text-[11px] font-extrabold flex items-center gap-1">
                <span>🚨 1930</span>
            </a>
        </div>
    </header>

    <!-- Main Scrollable App Screen Viewport -->
    <main class="flex-1 overflow-y-auto p-4 space-y-5 pb-24">

        <!-- Screen 1: Security Status Dashboard -->
        <div id="screen-home" class="space-y-4">
            <!-- Mobile Protection Score Card -->
            <div class="mobile-card p-5 bg-gradient-to-br from-slate-800 via-slate-800 to-emerald-950/40 border-emerald-500/30">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Personal Security Score</span>
                    <span class="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded-full text-[10px] font-bold">Optimal</span>
                </div>
                <div class="flex items-baseline gap-2">
                    <span class="text-4xl font-black text-white">94%</span>
                    <span class="text-xs text-slate-400">Protection Status</span>
                </div>
                <p class="text-xs text-slate-300 mt-2">Zero active threats detected on this Android device.</p>
            </div>

            <!-- Quick Action Grid -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="switchMobileScreen('scan'); setMobileMode('UPI');" class="mobile-card p-4 text-left hover:border-emerald-500 transition-colors">
                    <span class="text-2xl block mb-1">💳</span>
                    <span class="text-xs font-bold text-white block">Scan UPI ID</span>
                    <span class="text-[10px] text-slate-400">Check VPA handles</span>
                </button>

                <button onclick="switchMobileScreen('camera');" class="mobile-card p-4 text-left hover:border-emerald-500 transition-colors">
                    <span class="text-2xl block mb-1">📷</span>
                    <span class="text-xs font-bold text-white block">Camera QR</span>
                    <span class="text-[10px] text-slate-400">Live rear camera</span>
                </button>

                <button onclick="switchMobileScreen('scan'); setMobileMode('SMS');" class="mobile-card p-4 text-left hover:border-emerald-500 transition-colors">
                    <span class="text-2xl block mb-1">💬</span>
                    <span class="text-xs font-bold text-white block">SMS Inspector</span>
                    <span class="text-[10px] text-slate-400">Banking SMS text</span>
                </button>

                <button onclick="switchMobileScreen('scan'); setMobileMode('PHONE');" class="mobile-card p-4 text-left hover:border-emerald-500 transition-colors">
                    <span class="text-2xl block mb-1">📞</span>
                    <span class="text-xs font-bold text-white block">Check Phone</span>
                    <span class="text-[10px] text-slate-400">Fraud caller numbers</span>
                </button>
            </div>
        </div>

        <!-- Screen 2: Instant Scanner View -->
        <div id="screen-scan" class="space-y-4">
            <div class="mobile-card p-5 space-y-4">
                <h2 class="text-lg font-bold text-white">Security Inspection Hub</h2>
                
                <!-- Category Select Tabs -->
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="setMobileMode('UPI')" id="mTab-UPI" class="scan-tab-mobile selected border border-slate-700 rounded-xl p-2.5 flex flex-col items-center gap-1 font-bold text-[11px] text-slate-300">
                        <span class="text-lg">💳</span>
                        <span>UPI</span>
                    </button>
                    <button type="button" onclick="setMobileMode('PHONE')" id="mTab-PHONE" class="scan-tab-mobile border border-slate-700 rounded-xl p-2.5 flex flex-col items-center gap-1 font-bold text-[11px] text-slate-300">
                        <span class="text-lg">📞</span>
                        <span>Phone</span>
                    </button>
                    <button type="button" onclick="setMobileMode('SMS')" id="mTab-SMS" class="scan-tab-mobile border border-slate-700 rounded-xl p-2.5 flex flex-col items-center gap-1 font-bold text-[11px] text-slate-300">
                        <span class="text-lg">💬</span>
                        <span>SMS</span>
                    </button>
                    <button type="button" onclick="setMobileMode('URL')" id="mTab-URL" class="scan-tab-mobile border border-slate-700 rounded-xl p-2.5 flex flex-col items-center gap-1 font-bold text-[11px] text-slate-300">
                        <span class="text-lg">🔗</span>
                        <span>URL</span>
                    </button>
                    <button type="button" onclick="setMobileMode('OCR')" id="mTab-OCR" class="scan-tab-mobile border border-slate-700 rounded-xl p-2.5 flex flex-col items-center gap-1 font-bold text-[11px] text-slate-300">
                        <span class="text-lg">📷</span>
                        <span>Image</span>
                    </button>
                    <button type="button" onclick="switchMobileScreen('camera')" class="scan-tab-mobile border border-slate-700 rounded-xl p-2.5 flex flex-col items-center gap-1 font-bold text-[11px] text-slate-300">
                        <span class="text-lg">📱</span>
                        <span>Camera</span>
                    </button>
                </div>

                <!-- Inputs -->
                <div id="mTextBlock" class="space-y-3">
                    <label id="mLabel" class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">Target UPI Handle / VPA</label>
                    <input type="text" id="mPayload" placeholder="e.g. scammer@ybl" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-semibold text-white focus:outline-none focus:border-emerald-500">
                    <button type="button" onclick="runMobileScan()" class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl text-xs shadow-lg transition-colors flex items-center justify-center gap-2">
                        <span>🔍 Run Threat Inspection</span>
                    </button>
                </div>

                <div id="mFileBlock" class="hidden space-y-3">
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">Upload Screenshot / QR</label>
                    <input type="file" id="mFile" accept="image/*" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-300">
                    <button type="button" onclick="runMobileScan()" class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl text-xs shadow-lg transition-colors">
                        🔍 Inspect Uploaded Screenshot
                    </button>
                </div>
            </div>

            <!-- Mobile Verdict Result Box -->
            <div id="mResultOutput"></div>
        </div>

        <!-- Screen 3: Live Android Camera QR Code View -->
        <div id="screen-camera" class="hidden space-y-4">
            <div class="mobile-card p-5 text-center space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-base font-bold text-white">Live Camera QR Scanner</h2>
                    <span class="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-400 rounded-full text-[10px] font-bold">Rear Camera</span>
                </div>

                <div class="relative rounded-2xl overflow-hidden border-2 border-emerald-500/50 bg-black">
                    <video id="cameraVideo" autoplay playsinline muted></video>
                    <canvas id="cameraCanvas" class="hidden"></canvas>
                    <div class="absolute inset-0 border-2 border-dashed border-emerald-400/60 rounded-2xl pointer-events-none"></div>
                </div>

                <div class="flex gap-2">
                    <button type="button" onclick="startMobileCamera()" class="flex-1 bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs">
                        🎥 Turn On Camera
                    </button>
                    <button type="button" onclick="captureFrameAndScan()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl text-xs">
                        📸 Capture & Scan QR
                    </button>
                </div>
                <p id="cameraStatus" class="text-xs text-slate-400 italic">Point camera at any UPI QR code or payment poster.</p>
            </div>
        </div>
    </main>

    <!-- Floating Android Bottom Navigation Bar Dock -->
    <nav class="bottom-dock fixed bottom-0 inset-x-0 h-16 flex items-center justify-around z-50 px-2">
        <button onclick="switchMobileScreen('home')" id="dock-home" class="dock-item active flex flex-col items-center gap-1 text-slate-400 hover:text-white">
            <span class="text-xl">🏠</span>
            <span class="text-[10px]">Home</span>
        </button>

        <button onclick="switchMobileScreen('scan')" id="dock-scan" class="dock-item flex flex-col items-center gap-1 text-slate-400 hover:text-white">
            <span class="text-xl">🔍</span>
            <span class="text-[10px]">Scan</span>
        </button>

        <button onclick="switchMobileScreen('camera')" id="dock-camera" class="dock-item flex flex-col items-center gap-1 text-slate-400 hover:text-white">
            <span class="text-xl">📷</span>
            <span class="text-[10px]">Camera QR</span>
        </button>

        <a href="/report" class="dock-item flex flex-col items-center gap-1 text-slate-400 hover:text-white">
            <span class="text-xl text-red-500">🚩</span>
            <span class="text-[10px]">Report</span>
        </a>

        <a href="/history" class="dock-item flex flex-col items-center gap-1 text-slate-400 hover:text-white">
            <span class="text-xl">📊</span>
            <span class="text-[10px]">History</span>
        </a>
    </nav>

    <script>
        let mobileMode = 'UPI';
        let mediaStream = null;

        const mobileConfigs = {
            'UPI': { label: 'Target UPI Handle / VPA', placeholder: 'e.g. scammer@ybl', type: 'text' },
            'PHONE': { label: 'Target Phone Number', placeholder: 'e.g. 9876543210', type: 'text' },
            'URL': { label: 'Target Website URL', placeholder: 'e.g. http://login-verify-bank.com', type: 'text' },
            'SMS': { label: 'Suspicious SMS Text Content', placeholder: 'e.g. Bank account suspended...', type: 'text' },
            'OCR': { type: 'file' }
        };

        function switchMobileScreen(screen) {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-scan').classList.add('hidden');
            document.getElementById('screen-camera').classList.add('hidden');

            document.querySelectorAll('.dock-item').forEach(d => d.classList.remove('active'));

            if (screen === 'home') {
                document.getElementById('screen-home').classList.remove('hidden');
                document.getElementById('dock-home').classList.add('active');
                stopMobileCamera();
            } else if (screen === 'scan') {
                document.getElementById('screen-scan').classList.remove('hidden');
                document.getElementById('dock-scan').classList.add('active');
                stopMobileCamera();
            } else if (screen === 'camera') {
                document.getElementById('screen-camera').classList.remove('hidden');
                document.getElementById('dock-camera').classList.add('active');
                startMobileCamera();
            }
        }

        function setMobileMode(mode) {
            mobileMode = mode;
            document.querySelectorAll('.scan-tab-mobile').forEach(t => t.classList.remove('selected'));
            const tab = document.getElementById('mTab-' + mode);
            if (tab) tab.classList.add('selected');

            const cfg = mobileConfigs[mode];
            const textBlock = document.getElementById('mTextBlock');
            const fileBlock = document.getElementById('mFileBlock');

            if (cfg.type === 'file') {
                textBlock.classList.add('hidden');
                fileBlock.classList.remove('hidden');
            } else {
                fileBlock.classList.add('hidden');
                textBlock.classList.remove('hidden');
                document.getElementById('mLabel').textContent = cfg.label;
                document.getElementById('mPayload').placeholder = cfg.placeholder;
            }
        }

        function runMobileScan() {
            const out = document.getElementById('mResultOutput');
            out.innerHTML = `
                <div class="mobile-card p-4 text-center text-slate-300 font-medium text-xs">
                    <svg class="animate-spin h-6 w-6 text-emerald-400 mx-auto mb-2" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Inspecting cybercrime databases...</span>
                </div>
            `;

            if (mobileMode === 'OCR') {
                const fileInput = document.getElementById('mFile');
                if (!fileInput || !fileInput.files || !fileInput.files[0]) {
                    out.innerHTML = `<div class="mobile-card p-4 border-l-4 border-l-amber-500 text-xs text-amber-300">Please select an image file or screenshot first.</div>`;
                    return;
                }
                let fd = new FormData();
                fd.append('screenshot', fileInput.files[0]);

                fetch('/scan_ocr', {
                    method: 'POST',
                    body: fd
                }).then(r => r.json()).then(renderMobileResult).catch(err => {
                    out.innerHTML = `<div class="mobile-card p-4 border-l-4 border-l-red-500 text-xs text-red-400">OCR Analysis failed: ${err.message}</div>`;
                });
                return;
            }

            let endpoint = '/check_upi';
            let bodyData = {};

            if (mobileMode === 'UPI') {
                endpoint = '/check_upi';
                bodyData = { upi: document.getElementById('mPayload').value.trim() };
            } else if (mobileMode === 'PHONE') {
                endpoint = '/check_phone';
                bodyData = { phone: document.getElementById('mPayload').value.trim() };
            } else if (mobileMode === 'URL') {
                endpoint = '/check_url';
                bodyData = { url: document.getElementById('mPayload').value.trim() };
            } else if (mobileMode === 'SMS') {
                endpoint = '/check_sms';
                bodyData = { sms: document.getElementById('mPayload').value.trim() };
            }

            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            }).then(r => r.json()).then(renderMobileResult).catch(err => {
                out.innerHTML = `<div class="mobile-card p-4 border-l-4 border-l-red-500 text-xs text-red-400">Inspection failed: ${err.message}</div>`;
            });
        }

        function renderMobileResult(data) {
            const out = document.getElementById('mResultOutput');
            let isDanger = data.score > 7 || data.result === 'Dangerous';
            let borderColor = isDanger ? 'border-l-red-500' : 'border-l-emerald-500';
            let badgeBg = isDanger ? 'bg-red-500/20 text-red-400 border-red-500/40' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40';

            out.innerHTML = `
                <div class="mobile-card p-5 border-l-4 ${borderColor} space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-wider border ${badgeBg}">
                            ${data.result || 'Verdict'}
                        </span>
                        <span class="text-xs font-bold text-slate-300">Threat Score: <strong class="text-white">${data.score || 0}</strong> / 25</span>
                    </div>
                    <p class="text-xs font-semibold text-white bg-slate-900 p-3 rounded-xl border border-slate-800">${data.reason || 'Payload analyzed cleanly.'}</p>
                    <p class="text-[11px] text-emerald-400 bg-emerald-950/40 p-2.5 rounded-xl border border-emerald-800/50">💡 ${data.advice || 'Maintain vigilance.'}</p>
                </div>
            `;
        }

        // HTML5 Camera Scanner
        async function startMobileCamera() {
            try {
                const video = document.getElementById('cameraVideo');
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = mediaStream;
                document.getElementById('cameraStatus').textContent = "Camera active. Tap Capture & Scan QR.";
            } catch (e) {
                document.getElementById('cameraStatus').textContent = "Camera access unavailable or denied.";
            }
        }

        function stopMobileCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        function captureFrameAndScan() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.getElementById('cameraCanvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                let fd = new FormData();
                fd.append('qr_image', blob, 'captured_qr.png');
                document.getElementById('cameraStatus').textContent = "Analyzing captured frame...";

                fetch('/scan_qr', { method: 'POST', body: fd })
                .then(r => r.json())
                .then(data => {
                    document.getElementById('cameraStatus').textContent = `Result: ${data.result || 'Scanned'} (Score: ${data.score || 0})`;
                })
                .catch(err => {
                    document.getElementById('cameraStatus').textContent = "Error scanning QR frame.";
                });
            }, 'image/png');
        }

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
